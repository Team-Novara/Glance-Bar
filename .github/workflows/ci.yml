name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN.
permissions:
  contents: read

# Cancel in-progress runs for the same ref when a new commit lands,
# so we don't burn CI minutes on a superseded SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pin the LTS line and the latest line. The matrix exists
        # mainly to catch accidental `engines` pinning in package.json
        # and to surface any native-binding regressions (we have
        # none at present, but a future arboard / sysinfo bump could
        # land in here). 18 is excluded because Vite 7 dropped it.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run state tests
        run: npm run test:vitest:state
      - name: Run provider tests
        run: npm run test:vitest:providers
      - name: Run runtime tests
        run: npm run test:vitest:runtime
      - name: Run component & aggregation tests
        run: npx vitest run --reporter=verbose
      # Coverage gate: fails the job when providers/runtime/state drop
      # below 80% lines/functions. The include globs are passed as
      # repeated flags on purpose — a single comma-separated value is
      # parsed as one literal glob matching no files, which makes the
      # thresholds pass vacuously (0 files measured).
      - name: Run tests with coverage (threshold 80% for providers/runtime/state)
        run: npx vitest run --coverage --coverage.provider=v8 --coverage.reportsDirectory=coverage --coverage.thresholds.lines=80 --coverage.thresholds.functions=80 --coverage.include="src/providers/**" --coverage.include="src/runtime/**" --coverage.include="src/state/**"

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type-check
        run: npx tsc -b --noEmit

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3-platform check per STAGE6_CROSS_PLATFORM_DESIGN.md §7 —
        # catches cfg-gated code that only compiles on its own platform.
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      # Tauri's Linux build chain (gtk/webkit crates) needs the dev headers
      # even for `cargo check` — glib-sys's build script shells out to
      # pkg-config and fails without libglib2.0-dev. webkit2gtk-4.1-dev pulls
      # in the rest of the gtk stack as dependencies.
      - name: Install Linux build deps (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libglib2.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -W clippy::all -W clippy::pedantic --allow clippy::module_name_repetitions
      - name: Cargo fmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
